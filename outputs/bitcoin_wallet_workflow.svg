<svg viewBox="90 150 1420 200" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#9aa7b8" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa3ad"/>
    </marker>
  </defs>

  <!-- ===================== STAGE 1: cylinder (dataset) ===================== -->
  <g filter="url(#softShadow)">
    <path d="M 105 180
             a 115 22 0 0 1 230 0
             l 0 116
             a 115 22 0 0 1 -230 0
             z"
          fill="#d9dde2" stroke="#b3bac2" stroke-width="2"/>
    <path d="M 105 180 a 115 22 0 0 0 230 0"
          fill="#e7eaee" stroke="#b3bac2" stroke-width="2"/>
  </g>
  <text x="220" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#2b3744">Bitcoin Wallet</text>
  <text x="220" y="276" text-anchor="middle" font-size="17" fill="#54616e">(address +</text>
  <text x="220" y="298" text-anchor="middle" font-size="17" fill="#54616e">transactions)</text>

  <!-- ===================== STAGE 2: process (yellow) ===================== -->
  <rect x="395" y="170" width="230" height="160" rx="18" ry="18"
        fill="#fdf3c7" stroke="#e8d488" stroke-width="2" filter="url(#softShadow)"/>
  <text x="510" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#5c4f1f">Feature</text>
  <text x="510" y="276" text-anchor="middle" font-size="22" font-weight="700" fill="#5c4f1f">Engineering</text>
  <text x="510" y="302" text-anchor="middle" font-size="17" fill="#7a6b34">(12 features)</text>

  <!-- ===================== STAGE 3: process (yellow) ===================== -->
  <rect x="685" y="170" width="230" height="160" rx="18" ry="18"
        fill="#fdf3c7" stroke="#e8d488" stroke-width="2" filter="url(#softShadow)"/>
  <text x="800" y="258" text-anchor="middle" font-size="22" font-weight="700" fill="#5c4f1f">Ego-Graph</text>
  <text x="800" y="286" text-anchor="middle" font-size="22" font-weight="700" fill="#5c4f1f">Construction</text>

  <!-- ===================== STAGE 4: process (yellow) ===================== -->
  <rect x="975" y="170" width="230" height="160" rx="18" ry="18"
        fill="#fdf3c7" stroke="#e8d488" stroke-width="2" filter="url(#softShadow)"/>
  <text x="1090" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#5c4f1f">GATv2 Graph</text>
  <text x="1090" y="276" text-anchor="middle" font-size="22" font-weight="700" fill="#5c4f1f">Neural Network</text>

  <!-- ===================== STAGE 5: output (green) ===================== -->
  <rect x="1265" y="170" width="230" height="160" rx="18" ry="18"
        fill="#d8f0d6" stroke="#a4d6a0" stroke-width="2" filter="url(#softShadow)"/>
  <text x="1380" y="240" text-anchor="middle" font-size="22" font-weight="700" fill="#2c4f2a">Risk Score:</text>
  <text x="1380" y="274" text-anchor="middle" font-size="20" font-weight="600" fill="#3a6137">Benign /</text>
  <text x="1380" y="300" text-anchor="middle" font-size="20" font-weight="600" fill="#3a6137">Criminal</text>

  <!-- ===================== ARROWS ===================== -->
  <line x1="338" y1="250" x2="392" y2="250" stroke="#9aa3ad" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="628" y1="250" x2="682" y2="250" stroke="#9aa3ad" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="918" y1="250" x2="972" y2="250" stroke="#9aa3ad" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1208" y1="250" x2="1262" y2="250" stroke="#9aa3ad" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- arrow labels -->
  <text x="365" y="238" text-anchor="middle" font-size="14" fill="#7b8794">extract</text>
  <text x="655" y="238" text-anchor="middle" font-size="14" fill="#7b8794">build</text>
  <text x="945" y="238" text-anchor="middle" font-size="14" fill="#7b8794">embed</text>
  <text x="1235" y="238" text-anchor="middle" font-size="14" fill="#7b8794">classify</text>
</svg>
