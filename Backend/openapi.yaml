openapi: 3.0.0
info:
  title: Crypto Wallet Analysis API
  description: Real-time cryptocurrency wallet risk assessment using Graph Neural Networks
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://api.example.com
    description: Production server

tags:
  - name: health
    description: Health check endpoints
  - name: wallet
    description: Wallet management and validation
  - name: transactions
    description: Transaction management and validation

paths:
  /api/v1/health:
    get:
      tags:
        - health
      summary: Check API health status
      operationId: health_check
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy

  /api/v1/ping:
    get:
      tags:
        - health
      summary: Ping the API
      operationId: ping
      responses:
        '200':
          description: Pong response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: pong

  /api/v1/analyze/{address}:
    get:
      tags:
        - wallet
      summary: Analyze cryptocurrency wallet for risk assessment
      description: Fetches transaction graph, computes features, and runs GNN model inference
      operationId: analyze_wallet
      parameters:
        - name: address
          in: path
          required: true
          description: Wallet address (Bitcoin, Ethereum, or generic hex)
          schema:
            type: string
            example: "1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa"
        - name: model_path
          in: query
          required: false
          description: Path to trained GNN model
          schema:
            type: string
            default: "../models/crypto_gnn_model.pt"
      responses:
        '200':
          description: Analysis completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResult'
        '400':
          description: Invalid wallet address or analysis failed

  /api/v1/wallets:
    get:
      tags:
        - wallet
      summary: List all wallets
      operationId: list_wallets
      responses:
        '200':
          description: List of all wallets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Wallet'

    post:
      tags:
        - wallet
      summary: Create a new wallet
      operationId: create_wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletCreate'
      responses:
        '200':
          description: Wallet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400':
          description: Invalid wallet address format

  /api/v1/wallets/{wallet_id}:
    get:
      tags:
        - wallet
      summary: Get a specific wallet
      operationId: get_wallet
      parameters:
        - name: wallet_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Wallet details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '404':
          description: Wallet not found

    put:
      tags:
        - wallet
      summary: Update an existing wallet
      operationId: update_wallet
      parameters:
        - name: wallet_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletCreate'
      responses:
        '200':
          description: Wallet updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '404':
          description: Wallet not found

    delete:
      tags:
        - wallet
      summary: Delete a wallet
      operationId: delete_wallet
      parameters:
        - name: wallet_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Wallet deleted successfully
        '404':
          description: Wallet not found

  /api/v1/wallets/validate:
    post:
      tags:
        - wallet
      summary: Validate a wallet address
      operationId: validate_wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletCreate'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                  is_valid:
                    type: boolean
                  message:
                    type: string

  /api/v1/transactions:
    get:
      tags:
        - transactions
      summary: List all transactions
      operationId: list_transactions
      responses:
        '200':
          description: List of all transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'

    post:
      tags:
        - transactions
      summary: Create a new transaction
      operationId: create_transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreate'
      responses:
        '200':
          description: Transaction created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Invalid transaction format or values

  /api/v1/transactions/{transaction_id}:
    get:
      tags:
        - transactions
      summary: Get a specific transaction
      operationId: get_transaction
      parameters:
        - name: transaction_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Transaction details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          description: Transaction not found

    put:
      tags:
        - transactions
      summary: Update an existing transaction
      operationId: update_transaction
      parameters:
        - name: transaction_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreate'
      responses:
        '200':
          description: Transaction updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          description: Transaction not found

    delete:
      tags:
        - transactions
      summary: Delete a transaction
      operationId: delete_transaction
      parameters:
        - name: transaction_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Transaction deleted successfully
        '404':
          description: Transaction not found

  /api/v1/transactions/validate:
    post:
      tags:
        - transactions
      summary: Validate a transaction
      operationId: validate_transaction_endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreate'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  tx_hash:
                    type: string
                  is_valid:
                    type: boolean
                  message:
                    type: string

components:
  schemas:
    AnalysisResult:
      type: object
      properties:
        wallet_address:
          type: string
          description: The analyzed wallet address
          example: "1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa"
        status:
          type: string
          description: Analysis status
          example: "success"
        nodes_count:
          type: integer
          description: Number of nodes in transaction graph
          example: 50
        edges_count:
          type: integer
          description: Number of edges in transaction graph
          example: 51
        graph_data:
          type: object
          description: Graph tensor shapes
          properties:
            x_shape:
              type: array
              items:
                type: integer
              example: [50, 18]
            y_shape:
              type: array
              items:
                type: integer
              example: [50]
            edge_index_shape:
              type: array
              items:
                type: integer
              example: [2, 51]
            edge_attr_shape:
              type: array
              items:
                type: integer
              example: [51, 1]
        classification:
          type: string
          nullable: true
          enum: [criminal, benign]
          description: Wallet classification result
          example: "benign"
        prediction:
          type: array
          nullable: true
          items:
            type: number
          description: Model prediction probabilities [benign, criminal]
          example: [0.544, 0.456]
        risk_score:
          type: number
          nullable: true
          description: Probability of criminal activity (0-1)
          example: 0.456
        confidence:
          type: number
          nullable: true
          description: Confidence of classification (0-1)
          example: 0.544
        message:
          type: string
          nullable: true
          description: Human-readable result message
          example: "Wallet classified as BENIGN with 54.4% confidence"
        inference_error:
          type: string
          nullable: true
          description: Error message if inference failed

    Wallet:
      type: object
      properties:
        id:
          type: integer
        address:
          type: string
          description: Wallet address (Ethereum, Bitcoin, or hex format)
        is_valid:
          type: boolean
        balance:
          type: number
          nullable: true
        created_at:
          type: string
          nullable: true
      required:
        - id
        - address
        - is_valid

    WalletCreate:
      type: object
      properties:
        address:
          type: string
          description: Valid wallet address
        balance:
          type: number
          nullable: true
      required:
        - address

    Transaction:
      type: object
      properties:
        id:
          type: integer
        tx_hash:
          type: string
          description: Transaction hash (hex format)
        from_address:
          type: string
          description: Sender wallet address
        to_address:
          type: string
          description: Recipient wallet address
        amount:
          type: number
          description: Transaction amount
        status:
          type: string
          enum: [pending, confirmed, failed]
        timestamp:
          type: string
          nullable: true
        is_valid:
          type: boolean
      required:
        - id
        - tx_hash
        - from_address
        - to_address
        - amount
        - status
        - is_valid

    TransactionCreate:
      type: object
      properties:
        tx_hash:
          type: string
          description: Transaction hash (hex format)
        from_address:
          type: string
          description: Sender wallet address
        to_address:
          type: string
          description: Recipient wallet address
        amount:
          type: number
          description: Transaction amount (must be positive)
        status:
          type: string
          enum: [pending, confirmed, failed]
          default: pending
      required:
        - tx_hash
        - from_address
        - to_address
        - amount
